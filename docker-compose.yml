services:
  db:
    image: postgres:16-alpine
    container_name: gohunt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gohunt
      POSTGRES_PASSWORD: gohunt_dev
      POSTGRES_DB: gohunt
    ports:
      - "5433:5432"
    volumes:
      - gohunt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gohunt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gohunt_pgdata: