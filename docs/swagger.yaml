basePath: /
definitions:
  api.ProfileRequest:
    properties:
      current_role_title:
        type: string
      experience_years:
        type: integer
      location_pref:
        type: string
      name:
        type: string
      preferred_stack:
        items:
          type: string
        type: array
      remote_only:
        type: boolean
      salary_max:
        type: integer
      salary_min:
        type: integer
      skills:
        items:
          type: string
        type: array
      target_roles:
        items:
          type: string
        type: array
      timezone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: AI-powered job aggregation and application assistant.
  title: GoHunt API
  version: "1.1"
paths:
  /api/fetch/trigger:
    post:
      description: Fetches jobs from the configured source and stores new ones
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Trigger a job fetch
      tags:
      - fetch
  /api/jobs:
    get:
      description: Returns a paginated list of jobs. Use sort=score to rank by AI
        fit score.
      parameters:
      - description: 'Sort order: ''score'' for fit ranking, otherwise by date'
        in: query
        name: sort
        type: string
      - description: Max results (default 20)
        in: query
        name: limit
        type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List jobs
      tags:
      - jobs
  /api/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get user profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/api.ProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create or update user profile
      tags:
      - profile
  /api/score/trigger:
    post:
      description: Loads the profile, filters unscored jobs, scores them via Claude,
        stores results
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Score unscored jobs
      tags:
      - scoring
swagger: "2.0"
